<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="低空弱小目标数据集，按文件夹逐级浏览和下载数据文件。">
  <meta name="color-scheme" content="light">
  <title>低空弱小目标数据集</title>
  <link rel="icon" href="./favicon.svg?v=2" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=5">
  <script src="./script.js?v=5" defer></script>
</head>
<body>
  <main>
    <h1>低空弱小目标数据集</h1>
    <section aria-labelledby="catalog-title">
      <h2 id="catalog-title">数据文件目录</h2>
      <nav id="breadcrumbs" aria-label="当前目录" hidden></nav>
      <p id="dataset-notice" hidden></p>
      <p id="rd-status" role="status" aria-live="polite" hidden></p>
      <p id="archive-download" hidden></p>
      <div id="rd-download-tools" hidden></div>
      <p id="status" role="status" aria-live="polite">正在加载目录…</p>
      <div id="load-error" role="alert" hidden>
        <p>目录暂时无法加载，请稍后重试。</p>
        <button id="retry" type="button">重新加载</button>
      </div>
      <noscript><p>请启用 JavaScript 以浏览目录，也可查看 <a href="./datasets.json">文件清单</a>。</p></noscript>
      <div id="table-wrap" hidden>
        <table>
          <thead><tr><th scope="col">名称</th><th scope="col" class="size">大小</th><th scope="col" class="action"><span class="sr-only">操作</span></th></tr></thead>
          <tbody id="file-list"></tbody>
        </table>
      </div>
      <nav id="pagination" aria-label="当前目录分页" hidden>
        <button id="previous-page" type="button">上一页</button>
        <span id="page-info"></span>
        <button id="next-page" type="button">下一页</button>
      </nav>
    </section>
  </main>
</body>
</html>
